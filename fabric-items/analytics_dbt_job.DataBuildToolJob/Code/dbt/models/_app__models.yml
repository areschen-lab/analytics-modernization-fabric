version: 2
models:
  - name: stg_orders
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null

  - name: int_payments_by_order
    description: "Aggregates payment records to order grain."
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null

  - name: int_reviews_canonical
    description: "One canonical review per order."
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null

  - name: dim_customer
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
      - name: customer_unique_id
        data_tests:
          - not_null
  - name: fact_orders
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
  - name: fact_order_items
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_orders')
                field: order_id
      - name: order_item_id
        data_tests:
          - not_null
  - name: dim_product
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null
  - name: dim_seller
    columns:
      - name: seller_id
        data_tests:
          - unique
          - not_null
  - name: dim_date
    columns:
      - name: date
        data_tests:
          - unique
          - not_null          